name: Publish geoworld (PyPI)

# Tagging `python-vX.Y.Z` publishes packages/python/geoworld to PyPI through
# trusted publishing (OIDC): no token to store. One-time setup on pypi.org:
# project `geoworld` → Publishing → add a GitHub publisher with owner
# `andresgmg`, repository `World-GeoJSON`, workflow `publish-python.yml`,
# environment `pypi` (register it as a "pending publisher" before the first
# release). The tag must match the version in src/geoworld/client.py.
# A manual run (workflow_dispatch) builds and tests but does not publish.

on:
  push:
    tags: ["python-v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/geoworld/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout (no data)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/data/**
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install build pytest ./packages/python/geoworld

      - name: Tests
        run: pytest packages/python/geoworld

      - name: Build sdist and wheel
        run: python -m build packages/python/geoworld --outdir dist

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/python-v')
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          ls dist
          test -f "dist/geoworld-${version}.tar.gz" || { echo "::error::tag ${GITHUB_REF_NAME} does not match the built version"; exit 1; }

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/python-v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
