name: Validate data

on:
  push:
    branches: [main]
    paths: &data_paths
      - "data/**"
      - "schemas/**"
      - "pipeline/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths: *data_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate datasets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Unlike the docs workflow, this one genuinely needs the .geojson
          # files: it re-derives every manifest from them.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        # Only ijson is needed here; the docs toolchain is not.
        run: pip install -r requirements-dev.txt

      - name: Validate
        run: wgj validate --checksums

      - name: Check every file is finalized (ids, hierarchy, bbox, canonical layout)
        run: wgj finalize --check data/earth/*/

      - name: Check data/index.json is up to date
        run: wgj index --check

      - name: Check manifests are up to date
        run: |
          wgj manifest data/earth/*/
          if ! git diff --quiet -- 'data/**/manifest.json'; then
            echo "::error::A committed manifest disagrees with a fresh regeneration."
            echo "Run: wgj manifest data/earth/<ISO3>"
            git diff --stat -- 'data/**/manifest.json'
            exit 1
          fi
          echo "manifests match a clean regeneration"
