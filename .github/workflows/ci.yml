name: CI

# Lint, type-check and test the pipeline package (pipeline/), the Python client
# (packages/python/geoworld) and the JavaScript client (packages/js/geoworld).
# Data validation has its own workflow (validate-data.yml); the docs build has
# docs.yml; publishing the clients has publish-python.yml and publish-js.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no data)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/data/**
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout (manifests + fixture countries only)
        uses: actions/checkout@v7
        with:
          # The pipeline tests use three small countries as fixtures and every
          # manifest; the client tests use fixtures/ only. The rest of the
          # 160 MB data tree is not needed.
          sparse-checkout: |
            /*
            !/data/**
            /data/**/manifest.json
            /data/index.json
            /data/earth/ABW/**
            /data/earth/BRB/**
            /data/earth/DOM/**
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Pytest
        run: pytest

  previews:
    name: Previews reproduce byte-for-byte
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fixture countries only)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/data/**
            /data/earth/ABW/**
            /data/earth/BRB/**
            /data/earth/DOM/**
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the pipeline and the pinned mapshaper
        run: |
          pip install -r requirements-dev.txt
          npm ci

      - name: Regenerate previews
        run: wgj previews data/earth/ABW data/earth/BRB data/earth/DOM

      - name: Compare with the committed previews
        run: |
          if ! git diff --quiet -- data/earth/*/preview; then
            echo "::error::Regenerated previews differ from the committed ones."
            git diff --stat -- data/earth/*/preview
            exit 1
          fi
          echo "previews reproduce"

  js-client:
    name: JavaScript client (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout (no data)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/data/**
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (workspace)
        run: npm ci

      - name: Type-check sources and tests
        run: npm run lint -w packages/js/geoworld

      - name: Tests (node:test on fixtures/, incl. the cross-language golden)
        run: npm test -w packages/js/geoworld

      - name: Build ESM + CJS and check the tarball
        run: |
          npm run build -w packages/js/geoworld
          node -e "require('geoworld'); require('geoworld/node')"
          node --input-type=module -e "import 'geoworld'; import 'geoworld/node'"
          npm pack --dry-run -w packages/js/geoworld
