name: Docs

on:
  push:
    branches: [main]
    paths: &docs_paths
      - "docs/**"
      - "includes/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "requirements-docs*.txt"
      - "data/**/manifest.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *docs_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git-revision-date-localized needs the full commit graph...
          fetch-depth: 0
          # ...but not every historical version of a 70 MB GeoJSON blob.
          # blob:none makes this a partial clone: blobs are fetched lazily,
          # only when something actually reads them.
          filter: blob:none
          # The docs build reads no full-resolution GeoJSON — scripts/
          # gen_catalog.py works from manifest.json sidecars — but it does
          # copy each dataset's small preview next to its catalog page for
          # the interactive map. So check out the manifests and the previews
          # (8 MB in total) and skip the data itself. Non-cone patterns are
          # gitignore-style and later lines win.
          sparse-checkout: |
            /*
            !/data/**
            /data/**/manifest.json
            /data/**/preview/*.preview.geojson
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-docs-ci.txt

      - name: Install image libraries for social cards
        run: |
          # `|| true`: the runner image carries third-party apt sources
          # (azure-cli, and others) that intermittently 403, which fails the
          # whole update even though every package below comes from Ubuntu
          # main. If a package is genuinely unavailable, the install still
          # fails loudly on the next line.
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libfreetype6-dev libffi-dev \
            libjpeg-dev libpng-dev libz-dev pngquant

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs-ci.txt

      - name: Restore social card cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: mkdocs-social-${{ hashFiles('mkdocs.yml') }}-${{ github.sha }}
          restore-keys: |
            mkdocs-social-${{ hashFiles('mkdocs.yml') }}-

      - name: Check the previews were checked out
        run: |
          # Without them gen_catalog silently renders "No preview available"
          # on every page, and the site ships without a single map.
          n=$(find data -name '*.preview.geojson' | wc -l)
          echo "$n preview file(s) in the checkout"
          if [ "$n" -lt 50 ]; then
            echo "::error::only $n previews checked out — the sparse-checkout above is broken"
            exit 1
          fi

      - name: Build
        env:
          # Enables the `social` plugin, which is gated off locally so that
          # Windows contributors do not need the Cairo native library.
          CI: "true"
        run: mkdocs build --strict

      - name: Check the site carries the preview maps
        run: |
          expected=$(find data -name '*.preview.geojson' | wc -l)
          got=$(find site -name '*.preview.geojson' | wc -l)
          echo "$got preview file(s) in site/ ($expected in data/)"
          if [ "$got" -lt "$expected" ]; then
            echo "::error::gen_catalog copied $got of $expected previews into the site"
            exit 1
          fi

      - name: Check the site did not swallow the data tree
        run: |
          size=$(du -sm site | cut -f1)
          echo "site/ is ${size} MB"
          # Per-file, not total. The site legitimately grows with each
          # continent — it carries a preview per dataset, duplicated across
          # language builds — so a total-size cap would eventually fire on
          # normal growth. What must never appear is a full-resolution
          # dataset, and every one of those is far larger than any preview.
          big=$(find site -type f -size +5M)
          if [ -n "$big" ]; then
            echo "::error::files over 5 MB in site/ — full-resolution data has leaked into docs_dir"
            echo "$big" | xargs du -h
            exit 1
          fi
          if [ "$size" -gt 400 ]; then
            echo "::error::site/ is ${size} MB, which is beyond anything previews explain"
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
