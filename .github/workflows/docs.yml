name: Docs

on:
  push:
    branches: [main]
    paths: &docs_paths
      - "docs/**"
      - "includes/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "requirements-docs*.txt"
      - "data/**/manifest.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *docs_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git-revision-date-localized needs the full commit graph...
          fetch-depth: 0
          # ...but not every historical version of a 70 MB GeoJSON blob.
          # blob:none makes this a partial clone: blobs are fetched lazily,
          # only when something actually reads them.
          filter: blob:none
          # And the docs build reads no GeoJSON at all — scripts/gen_catalog.py
          # works exclusively from manifest.json sidecars. So check the
          # manifests out and skip the data itself. Non-cone patterns are
          # gitignore-style and later lines win.
          sparse-checkout: |
            /*
            !/data/**
            /data/**/manifest.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-docs-ci.txt

      - name: Install image libraries for social cards
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libfreetype6-dev libffi-dev \
            libjpeg-dev libpng-dev libz-dev pngquant

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs-ci.txt

      - name: Restore social card cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: mkdocs-social-${{ hashFiles('mkdocs.yml') }}-${{ github.sha }}
          restore-keys: |
            mkdocs-social-${{ hashFiles('mkdocs.yml') }}-

      - name: Build
        env:
          # Enables the `social` plugin, which is gated off locally so that
          # Windows contributors do not need the Cairo native library.
          CI: "true"
        run: mkdocs build --strict

      - name: Check the site did not swallow the data tree
        run: |
          size=$(du -sm site | cut -f1)
          echo "site/ is ${size} MB"
          if [ "$size" -gt 100 ]; then
            echo "::error::site/ is ${size} MB — data files have leaked into docs_dir"
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
