name: Release

# Tagging `vX.Y.Z` on main publishes a GitHub Release with the data as
# downloadable assets: one zip per territory, one for everything, the global
# index and a SHA256SUMS file. The zips are the bulk/offline channel and the
# fallback when a CDN refuses the repository for its size.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Re-publish an existing tag with the workflow as it is on the branch it is
  # dispatched from (main): the data comes from the tag, the steps and the
  # release notes from the branch. For a tag whose run failed, or one pushed
  # before its changelog section was written.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing data tag to publish, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish data release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Refuse to release stale or invalid data
        run: |
          wgj validate --checksums
          wgj finalize --check data/earth/*/
          wgj index --check

      - name: Build assets
        run: |
          set -euo pipefail
          tag="${TAG}"
          mkdir -p dist
          for dir in data/*/*/; do
            body=$(basename "$(dirname "$dir")")
            code=$(basename "$dir")
            (cd "data/$body" && zip -qr "../../dist/world-geojson-${tag}-${code}.zip" "$code")
          done
          zip -qr "dist/world-geojson-${tag}-all.zip" data -x 'data/index.json'
          cp data/index.json "dist/index.json"
          (cd dist && sha256sum ./* > SHA256SUMS)
          # The whole listing, not `| head`: under pipefail, head closing the
          # pipe makes ls fail with a write error once there are more lines
          # than it reads (v1.2.0's 169 assets aborted the first run here).
          ls -la dist
          echo "$(ls dist | wc -l) files"
          du -sh dist

      - name: Release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The changelog of the commit this run belongs to: the tag itself on
          # a tag push, the branch head on a dispatch, so a section written
          # after the tag still reaches the release notes.
          gh api "repos/${GITHUB_REPOSITORY}/contents/docs/about/changelog.md?ref=${GITHUB_SHA}" \
            -H "Accept: application/vnd.github.raw" > "${RUNNER_TEMP}/changelog.md"
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ["TAG"].lstrip("v")
          text = Path(os.environ["RUNNER_TEMP"], "changelog.md").read_text("utf-8")
          m = re.search(rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = m.group(1).strip() if m else "See docs/about/changelog.md."
          intro = (
              f"Data release **v{tag}**. Pin it with\n"
              f"`https://raw.githubusercontent.com/andresgmg/World-GeoJSON/v{tag}/data/<path>`\n"
              f"or download the assets below (`SHA256SUMS` covers every file).\n\n"
          )
          Path("dist/NOTES.md").write_text(intro + body + "\n", "utf-8")
          PY

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            --title "World GeoJSON ${TAG}" \
            --notes-file dist/NOTES.md \
            dist/world-geojson-*.zip dist/index.json dist/SHA256SUMS
