name: Publish geoworld (npm)

# Tagging `js-vX.Y.Z` publishes packages/js/geoworld to npm with provenance.
# Authentication: an `NPM_TOKEN` repository secret (an automation token for
# the `geoworld` package) — or, once the package exists on npm and trusted
# publishing is configured for this workflow on npmjs.com, remove the token
# and npm authenticates through the OIDC id-token below. The tag must match
# the version in packages/js/geoworld/package.json.

on:
  push:
    tags: ["js-v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/geoworld
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout (no data)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/data/**
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install (workspace)
        run: npm ci

      - name: Type-check, test, build
        run: |
          npm run lint -w packages/js/geoworld
          npm test -w packages/js/geoworld
          npm run build -w packages/js/geoworld

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/js-v')
        run: |
          version="${GITHUB_REF_NAME#js-v}"
          actual=$(node -p "require('./packages/js/geoworld/package.json').version")
          test "$version" = "$actual" || { echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ($actual)"; exit 1; }

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/js-v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w packages/js/geoworld --provenance --access public

      - name: Dry run (manual dispatch)
        if: "!startsWith(github.ref, 'refs/tags/js-v')"
        run: npm publish -w packages/js/geoworld --dry-run --access public
