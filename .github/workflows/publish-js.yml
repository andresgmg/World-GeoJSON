name: Publish geoworld (npm)

# Tagging `js-vX.Y.Z` publishes every package under packages/js/ to npm with
# provenance: geoworld first, then geoworld-leaflet, geoworld-maplibre and
# geoworld-react. All four share one version (lockstep); the tag must match
# it, the client's VERSION constant and the adapters' peer range. Packages
# already on the registry at that version are skipped, so a tag whose run
# stopped halfway can be re-run.
#
# Authentication: an `NPM_TOKEN` repository secret (a granular automation
# token allowed to publish these packages). Trusted publishing (OIDC) is
# configured per package on npmjs.com and needs the package to exist, so the
# first release of a new name goes through the token; afterwards the token
# can be dropped and npm authenticates with the id-token below.

on:
  push:
    tags: ["js-v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGES: geoworld geoworld-leaflet geoworld-maplibre geoworld-react

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/geoworld
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout (no data)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/data/**
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install (workspace)
        run: npm ci

      - name: Type-check, test, build
        run: |
          npm run build -w packages/js/geoworld
          npm run lint --workspaces
          npm test --workspaces
          npm run build --workspaces

      - name: Tag matches every package version, the client constant and the peer range
        if: startsWith(github.ref, 'refs/tags/js-v')
        run: |
          version="${GITHUB_REF_NAME#js-v}"
          for pkg in $PACKAGES; do
            actual=$(node -p "require('./packages/js/$pkg/package.json').version")
            test "$version" = "$actual" || { echo "::error::$pkg is $actual, tag is $version"; exit 1; }
          done
          constant=$(node -p "require('./packages/js/geoworld/dist/cjs/index.js').VERSION")
          test "$version" = "$constant" || { echo "::error::geoworld VERSION constant is $constant, tag is $version"; exit 1; }
          expected_peer="^${version%.*}.0"
          for pkg in geoworld-leaflet geoworld-maplibre geoworld-react; do
            peer=$(node -p "require('./packages/js/$pkg/package.json').peerDependencies.geoworld")
            test "$peer" = "$expected_peer" || { echo "::error::$pkg peer geoworld is $peer, expected $expected_peer"; exit 1; }
          done

      - name: Publish (skipping versions already on the registry)
        if: startsWith(github.ref, 'refs/tags/js-v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#js-v}"
          for pkg in $PACKAGES; do
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version is already published; skipping"
              continue
            fi
            npm publish -w "packages/js/$pkg" --provenance --access public
          done

      - name: Dry run (manual dispatch)
        if: "!startsWith(github.ref, 'refs/tags/js-v')"
        run: |
          for pkg in $PACKAGES; do
            npm publish -w "packages/js/$pkg" --dry-run --access public
          done
