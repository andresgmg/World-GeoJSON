version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      mkdocs:
        patterns:
          - "mkdocs*"
    labels:
      - documentation
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - ci
      - dependencies

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - pipeline
      - dependencies
