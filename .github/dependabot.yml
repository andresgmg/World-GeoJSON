# Dependabot: as few pull requests as possible.
#
# Every ecosystem groups ALL of its updates into a single pull request, is
# checked once a month, and may have at most one pull request open at a time.
# Worst case that is three pull requests a month (pip, actions, npm), each one
# a single grouped bump. Security updates are grouped the same way.
version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    labels:
      - dependencies
