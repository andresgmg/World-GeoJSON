# Tooling configuration for the World GeoJSON pipeline (pipeline/, the `wgj`
# package), the Python client (packages/python/geoworld) and their tests.
# Install with:
#
#   pip install -r requirements-dev.txt      # includes both packages, editable
#   ruff check . && ruff format --check . && mypy && pytest

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "docs", "site", "node_modules", ".cache", ".venv", "fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Em dashes and accented characters in messages and comments are deliberate.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["wgj", "geoworld"]

[tool.mypy]
python_version = "3.11"
files = ["pipeline/src", "pipeline/tests", "scripts", "packages/python/geoworld"]
mypy_path = "pipeline/src:packages/python/geoworld/src"
explicit_package_bases = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# ijson ships no type stubs and the MkDocs hook signatures are untyped.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "packages/python/geoworld/tests"]
pythonpath = ["pipeline/src", "packages/python/geoworld/src"]
addopts = "-ra"
markers = [
  "mapshaper: needs Node and mapshaper (npm install); skipped when absent",
]
